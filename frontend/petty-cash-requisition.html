<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petty Cash Requisition - Internal Approvals System</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230070AF'/%3E%3Cpath d='M8 4h10l6 6v18a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z' fill='white'/%3E%3Cpath d='M18 4v6h6' fill='%23D0E3F2'/%3E%3Cpath d='M10 19 L14 23 L22 14' stroke='%230070AF' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
    <!-- Auth gate: redirect anonymous visitors to login before paint. -->
    <script>
      (function() {
        var token = localStorage.getItem('authToken');
        var userData = localStorage.getItem('userData');
        if (!token || !userData) { window.location.replace('index.html'); return; }
        try {
          var payload = JSON.parse(atob(token.split('.')[1]));
          if (payload.exp && payload.exp * 1000 < Date.now()) {
            localStorage.removeItem('authToken');
            localStorage.removeItem('userData');
            localStorage.removeItem('refreshToken');
            window.location.replace('index.html');
          }
        } catch (e) { window.location.replace('index.html'); }
      })();
    </script>
    <!-- Inter typeface -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Shared financial form styles -->
    <link rel="stylesheet" href="forms.css">
    <style>
        .nav-header { max-width: 1040px; }
        .container  { max-width: 1040px; }

        /* Inline loading (not fullscreen overlay) */
        .loading {
            position: static;
            background: transparent;
            display: none;
            text-align: center;
            padding: 20px;
        }
        .loading .spinner {
            border-color: #E6EDF5;
            border-top-color: var(--color-primary);
            width: 36px;
            height: 36px;
        }
    </style>
</head>
<body>
    <!-- Navigation Header -->
    <div class="nav-header">
        <a href="index.html" class="nav-btn nav-btn-home">
            Home
        </a>
        <button onclick="goBack()" class="nav-btn nav-btn-back">
            <span>&#8592;</span> Back
        </button>
    </div>

    <div class="container">
        <div class="rf-title-block">
            <div>
                <h1>Petty Cash Requisition</h1>
                <div class="rf-subtitle">HOD, then Finance approval</div>
            </div>
        </div>

        <div id="alert" class="alert"></div>
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Processing...</p>
        </div>

        <form id="pettyCashForm">
            <div class="rf-layout">
                <div>
                    <!-- Basic Information -->
                    <div class="field-section">
                        <div class="rf-section-head"><span class="rf-section-num">01</span><h2>Requisition Details</h2></div>
                        <label class="rf-check-row">
                            <input type="checkbox" id="onBehalfOf" onchange="toggleOnBehalfOf()">
                            Submit on behalf of someone else
                        </label>
                        <div class="rf-grid">
                            <div class="rf-field">
                                <label for="payee_name">Payee Name <span class="required">*</span></label>
                                <input type="text" id="payee_name" required readonly placeholder="Name of person/entity receiving cash">
                            </div>
                            <div class="rf-field">
                                <label for="department">Department <span class="required">*</span></label>
                                <input type="text" id="department" required readonly>
                            </div>
                            <div class="rf-field span-2">
                                <label for="purpose">Purpose <span class="required">*</span></label>
                                <textarea id="purpose" required placeholder="Describe the purpose of this petty cash request"></textarea>
                            </div>
                            <div class="rf-field span-2">
                                <label for="description">Additional Description</label>
                                <textarea id="description" placeholder="Any additional details or notes"></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- Line Items -->
                    <div class="field-section">
                        <div class="rf-section-head"><span class="rf-section-num">02</span><h2>Items</h2></div>
                        <div class="rf-table-wrap">
                            <table class="rf-table" id="itemsTable">
                                <thead>
                                    <tr>
                                        <th style="width: 60px;">Item No</th>
                                        <th>Description</th>
                                        <th style="width: 80px;">Qty</th>
                                        <th style="width: 150px;">Amount (K)</th>
                                        <th style="width: 44px;"></th>
                                    </tr>
                                </thead>
                                <tbody id="itemsTableBody">
                                    <!-- Rows will be added here -->
                                </tbody>
                            </table>
                        </div>
                        <button type="button" class="rf-add-row-btn" onclick="addItemRow()">+ Add item</button>
                    </div>
                </div>

                <aside class="stub">
                    <div class="stub-amount">
                        <span class="stub-label">Total Amount</span>
                        <div class="stub-figure" id="totalAmount">K 0.00</div>
                    </div>
                    <div class="stub-row">
                        <span class="stub-label">In words</span>
                        <span class="stub-value" id="amountWords" style="text-align:right; max-width:170px;">Amount in words will appear here</span>
                    </div>
                    <div class="stub-actions">
                        <button type="submit" class="btn btn-primary">Submit Requisition</button>
                        <button type="button" class="btn btn-secondary" onclick="window.location.href='index.html'">Cancel</button>
                    </div>
                    <div class="stub-foot">Routes to HOD → Finance. Reimbursed against attached receipts on issue.</div>
                </aside>
            </div>
        </form>
    </div>

    <script src="config.js"></script>
    <script>
        const API_URL = window.API_URL || 'http://localhost:3001/api';
        let itemCounter = 0;

        // Initialize form
        document.addEventListener('DOMContentLoaded', function() {
            const userData = JSON.parse(localStorage.getItem('userData') || '{}');
            document.getElementById('payee_name').value = userData.full_name || '';
            document.getElementById('department').value = userData.department || '';

            // Add initial row
            addItemRow();
        });

        function toggleOnBehalfOf() {
            const checkbox = document.getElementById('onBehalfOf');
            const payeeField = document.getElementById('payee_name');
            const deptField = document.getElementById('department');

            if (checkbox.checked) {
                // Enable fields for manual entry
                payeeField.readOnly = false;
                deptField.readOnly = false;
                payeeField.value = '';
                deptField.value = '';
                payeeField.focus();
            } else {
                // Restore user's own data
                const userData = JSON.parse(localStorage.getItem('userData') || '{}');
                payeeField.value = userData.full_name || '';
                deptField.value = userData.department || '';
                payeeField.readOnly = true;
                deptField.readOnly = true;
            }
        }

        function addItemRow() {
            itemCounter++;
            const tbody = document.getElementById('itemsTableBody');
            const row = tbody.insertRow();

            row.innerHTML = `
                <td><input type="number" class="item_no mono rf-center" value="${itemCounter}" readonly></td>
                <td><input type="text" class="description" required placeholder="Item description"></td>
                <td><input type="number" class="quantity rf-center" value="1" min="1" placeholder="Qty"></td>
                <td><input type="number" class="amount rf-num" step="0.01" value="0" onchange="calculateTotal()" required></td>
                <td><button type="button" class="rf-row-del" title="Remove" onclick="deleteItemRow(this)">×</button></td>
            `;
        }

        function deleteItemRow(button) {
            const tbody = document.getElementById('itemsTableBody');
            if (tbody.rows.length > 1) {
                button.closest('tr').remove();
                calculateTotal();
            } else {
                showAlert('At least one item is required', 'error');
            }
        }

        function calculateTotal() {
            const rows = document.getElementById('itemsTableBody').rows;
            let total = 0;

            for (let row of rows) {
                const amount = parseFloat(row.querySelector('.amount').value) || 0;
                total += amount;
            }

            document.getElementById('totalAmount').textContent = 'K ' + total.toFixed(2);

            // Convert to words
            if (total > 0) {
                const words = numberToWords(total);
                document.getElementById('amountWords').textContent = words + ' Kwacha Only';
            } else {
                document.getElementById('amountWords').textContent = 'Amount in words will appear here';
            }
        }

        function numberToWords(num) {
            const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine'];
            const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
            const teens = ['Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];

            if (num === 0) return 'Zero';

            const kwacha = Math.floor(num);
            const ngwee = Math.round((num - kwacha) * 100);

            let result = '';

            if (kwacha >= 1000000) {
                result += numberToWordsHelper(Math.floor(kwacha / 1000000)) + ' Million ';
                const remainder = kwacha % 1000000;
                if (remainder > 0) {
                    result += numberToWordsHelper(remainder);
                }
            } else {
                result = numberToWordsHelper(kwacha);
            }

            if (ngwee > 0) {
                result += ' and ' + numberToWordsHelper(ngwee) + ' Ngwee';
            }

            return result.trim();
        }

        function numberToWordsHelper(num) {
            const ones = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine'];
            const tens = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
            const teens = ['Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];

            if (num === 0) return '';
            if (num < 10) return ones[num];
            if (num < 20) return teens[num - 10];
            if (num < 100) {
                return tens[Math.floor(num / 10)] + (num % 10 !== 0 ? ' ' + ones[num % 10] : '');
            }
            if (num < 1000) {
                return ones[Math.floor(num / 100)] + ' Hundred' +
                       (num % 100 !== 0 ? ' and ' + numberToWordsHelper(num % 100) : '');
            }
            if (num < 1000000) {
                return numberToWordsHelper(Math.floor(num / 1000)) + ' Thousand' +
                       (num % 1000 !== 0 ? ' ' + numberToWordsHelper(num % 1000) : '');
            }

            return num.toString();
        }

        // Form submission
        document.getElementById('pettyCashForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const rows = document.getElementById('itemsTableBody').rows;
            if (rows.length === 0) {
                showAlert('Please add at least one item', 'error');
                return;
            }

            // Collect items
            const items = [];
            let totalAmount = 0;

            for (let row of rows) {
                const amount = parseFloat(row.querySelector('.amount').value) || 0;
                const description = row.querySelector('.description').value;

                if (!description.trim()) {
                    showAlert('Please fill in all item descriptions', 'error');
                    return;
                }

                items.push({
                    item_no: parseInt(row.querySelector('.item_no').value),
                    description: description,
                    quantity: parseInt(row.querySelector('.quantity').value) || 1,
                    amount: amount
                });

                totalAmount += amount;
            }

            if (totalAmount <= 0) {
                showAlert('Total amount must be greater than zero', 'error');
                return;
            }

            const amountInWords = document.getElementById('amountWords').textContent;

            const pettyCashData = {
                payee_name: document.getElementById('payee_name').value,
                department: document.getElementById('department').value,
                purpose: document.getElementById('purpose').value,
                description: document.getElementById('description').value || null,
                amount: totalAmount,
                amount_in_words: amountInWords,
                items: items
            };

            try {
                showLoading(true);
                const token = localStorage.getItem('authToken');

                const response = await fetch(`${API_URL}/forms/petty-cash-requisitions`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(pettyCashData)
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('Petty cash requisition submitted successfully!', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    showAlert(data.error || 'Failed to submit petty cash requisition', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('An error occurred while submitting the requisition', 'error');
            } finally {
                showLoading(false);
            }
        });

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';

            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        // Navigation function
        function goBack() {
            if (document.referrer && document.referrer.includes(window.location.hostname)) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
