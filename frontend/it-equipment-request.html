<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Equipment Request - Internal Approvals System</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230070AF'/%3E%3Cpath d='M8 4h10l6 6v18a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z' fill='white'/%3E%3Cpath d='M18 4v6h6' fill='%23D0E3F2'/%3E%3Cpath d='M10 19 L14 23 L22 14' stroke='%230070AF' stroke-width='3' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
    <!-- Auth gate: redirect anonymous visitors to login before paint. -->
    <script>
      (function() {
        var token = localStorage.getItem('authToken');
        var userData = localStorage.getItem('userData');
        if (!token || !userData) { window.location.replace('index.html'); return; }
        try {
          var payload = JSON.parse(atob(token.split('.')[1]));
          if (payload.exp && payload.exp * 1000 < Date.now()) {
            localStorage.removeItem('authToken');
            localStorage.removeItem('userData');
            localStorage.removeItem('refreshToken');
            window.location.replace('index.html');
          }
        } catch (e) { window.location.replace('index.html'); }
      })();
    </script>
    <!-- Inter typeface -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Shared financial form styles -->
    <link rel="stylesheet" href="forms.css">
    <style>
        .nav-header { max-width: 900px; }
        .container  { max-width: 900px; }

        /* Inline loading (not fullscreen overlay) */
        .loading {
            position: static;
            background: transparent;
            display: none;
            text-align: center;
            padding: 20px;
        }
        .loading .spinner {
            border-color: #E6EDF5;
            border-top-color: var(--color-primary);
            width: 36px;
            height: 36px;
        }

        /* Searchable equipment combobox */
        .combobox-wrapper { position: relative; }
        .equipment-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            margin-top: 4px;
            max-height: 240px;
            overflow-y: auto;
            z-index: 20;
            box-shadow: 0 6px 16px rgba(0,0,0,0.1);
        }
        .equipment-option {
            padding: 9px 11px;
            font-size: 14px;
            cursor: pointer;
        }
        .equipment-option:hover,
        .equipment-option.active {
            background: var(--bg-surface, #f0f4f8);
        }
        .equipment-category {
            padding: 6px 11px 2px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            color: var(--text-tertiary);
        }
        .equipment-empty {
            padding: 9px 11px;
            font-size: 13px;
            font-style: italic;
            color: var(--text-tertiary);
        }
    </style>
</head>
<body>
    <!-- Navigation Header -->
    <div class="nav-header">
        <a href="index.html" class="nav-btn nav-btn-home">
            Home
        </a>
        <button onclick="goBack()" class="nav-btn nav-btn-back">
            <span>&#8592;</span> Back
        </button>
    </div>

    <div class="container">
        <h1>IT Equipment Request Form</h1>

        <div id="alert" class="alert"></div>
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Processing...</p>
        </div>

        <form id="itEquipmentForm">
            <!-- Basic Information -->
            <div class="form-section">
                <h2>Request Details</h2>
                <div style="margin-bottom: 15px;">
                    <label style="display: flex; align-items: center; cursor: pointer;">
                        <input type="checkbox" id="onBehalfOf" style="width: 20px; height: 20px; margin-right: 10px;" onchange="toggleOnBehalfOf()">
                        <span style="font-size: 14px;">Submit on behalf of someone else</span>
                    </label>
                </div>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="requester_name">Requester Name <span class="required">*</span></label>
                        <input type="text" id="requester_name" required readonly>
                    </div>
                    <div class="form-group">
                        <label for="department">Department <span class="required">*</span></label>
                        <input type="text" id="department" required readonly>
                    </div>
                    <div class="form-group full-width combobox-wrapper">
                        <label for="equipment_description">Equipment Requested <span class="required">*</span></label>
                        <input type="text" id="equipment_description" required autocomplete="off"
                               placeholder="Start typing to search (e.g. laptop, monitor, printer)..."
                               oninput="filterEquipmentOptions()" onfocus="filterEquipmentOptions()">
                        <div id="equipmentDropdown" class="equipment-dropdown" style="display:none;"></div>
                        <p class="help-text">Can't find what you need? Just type your own description instead.</p>
                    </div>
                    <div class="form-group">
                        <label for="quantity">Quantity <span class="required">*</span></label>
                        <input type="number" id="quantity" min="1" value="1" required>
                    </div>
                    <div class="form-group full-width">
                        <label for="justification">Justification <span class="required">*</span></label>
                        <textarea id="justification" required placeholder="Explain why this equipment is needed"></textarea>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="actions">
                <button type="button" class="btn btn-secondary" onclick="window.location.href='index.html'">Cancel</button>
                <button type="submit" class="btn btn-primary">Submit Request</button>
            </div>
        </form>
    </div>

    <script src="config.js"></script>
    <script>
        const API_URL = window.API_URL || 'http://localhost:3001/api';

        // Catalog of equipment IT can issue, grouped for readability in the
        // dropdown. Not exhaustive by design — the field stays free text so
        // anyone can type something that isn't listed.
        const EQUIPMENT_CATALOG = [
            { category: 'Computers', items: [
                'Laptop - Dell Latitude', 'Laptop - Dell Precision', 'Laptop - HP EliteBook',
                'Laptop - HP ProBook', 'Laptop - Lenovo ThinkPad', 'Laptop - MacBook Air',
                'Laptop - MacBook Pro', 'Desktop - Dell OptiPlex', 'Desktop - HP EliteDesk',
                'Desktop - HP ProDesk', 'Desktop - Lenovo ThinkCentre', 'Mini PC'
            ]},
            { category: 'Displays & Printing', items: [
                'Monitor - 24"', 'Monitor - 27"', 'Monitor - Dual Monitor Stand',
                'Printer - HP LaserJet', 'Printer - HP OfficeJet', 'Printer - Canon',
                'Printer - Epson', 'Multifunction Printer/Scanner', 'Scanner',
                'Toner Cartridge', 'Ink Cartridge'
            ]},
            { category: 'Peripherals & Accessories', items: [
                'Wireless Mouse', 'Wired Mouse', 'Wireless Keyboard', 'Wired Keyboard',
                'Laptop Docking Station', 'USB Hub', 'Webcam', 'Headset - Wired',
                'Headset - Wireless/Bluetooth', 'External Hard Drive', 'External SSD',
                'USB Flash Drive', 'Laptop Bag', 'Laptop Charger/Power Adapter',
                'HDMI Cable', 'VGA Cable', 'Ethernet Cable', 'Surge Protector'
            ]},
            { category: 'Networking & Power', items: [
                'Wireless Router', 'Network Switch', 'Wireless Access Point', 'Modem',
                'UPS (Uninterruptible Power Supply)', 'Power Bank'
            ]},
            { category: 'Mobile & Communication', items: [
                'Smartphone', 'Tablet', 'SIM Card', 'Desk Phone', 'Conference Speakerphone'
            ]},
            { category: 'Audio/Visual', items: [
                'Projector', 'Video Conferencing Camera', 'Portable Speaker'
            ]},
            { category: 'Software & Licenses', items: [
                'Microsoft Office License', 'Windows OS License', 'Antivirus License',
                'Other Software License'
            ]},
            { category: 'Storage', items: [
                'NAS Storage Device'
            ]}
        ];

        let equipmentActiveIndex = -1;

        function filterEquipmentOptions() {
            const input = document.getElementById('equipment_description');
            const dropdown = document.getElementById('equipmentDropdown');
            const query = input.value.trim().toLowerCase();

            let html = '';
            let matchCount = 0;
            EQUIPMENT_CATALOG.forEach(group => {
                const matches = group.items.filter(item => !query || item.toLowerCase().includes(query));
                if (matches.length === 0) return;
                html += `<div class="equipment-category">${group.category}</div>`;
                matches.forEach(item => {
                    html += `<div class="equipment-option" onmousedown="selectEquipmentOption(event, '${item.replace(/'/g, "\\'")}')">${item}</div>`;
                    matchCount++;
                });
            });

            if (matchCount === 0) {
                html = `<div class="equipment-empty">No matches — your typed description will be used as-is.</div>`;
            }

            dropdown.innerHTML = html;
            dropdown.style.display = 'block';
            equipmentActiveIndex = -1;
        }

        function selectEquipmentOption(event, value) {
            event.preventDefault();
            document.getElementById('equipment_description').value = value;
            document.getElementById('equipmentDropdown').style.display = 'none';
        }

        document.addEventListener('click', function(e) {
            const wrapper = document.querySelector('.combobox-wrapper');
            if (wrapper && !wrapper.contains(e.target)) {
                document.getElementById('equipmentDropdown').style.display = 'none';
            }
        });

        // Initialize form
        document.addEventListener('DOMContentLoaded', function() {
            const userData = JSON.parse(localStorage.getItem('userData') || '{}');
            document.getElementById('requester_name').value = userData.full_name || '';
            document.getElementById('department').value = userData.department || '';
        });

        function toggleOnBehalfOf() {
            const checkbox = document.getElementById('onBehalfOf');
            const nameField = document.getElementById('requester_name');
            const deptField = document.getElementById('department');

            if (checkbox.checked) {
                // Enable fields for manual entry
                nameField.readOnly = false;
                deptField.readOnly = false;
                nameField.value = '';
                deptField.value = '';
                nameField.focus();
            } else {
                // Restore user's own data
                const userData = JSON.parse(localStorage.getItem('userData') || '{}');
                nameField.value = userData.full_name || '';
                deptField.value = userData.department || '';
                nameField.readOnly = true;
                deptField.readOnly = true;
            }
        }

        // Form submission
        document.getElementById('itEquipmentForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const requestData = {
                requester_name: document.getElementById('requester_name').value,
                department: document.getElementById('department').value,
                equipment_description: document.getElementById('equipment_description').value,
                quantity: parseInt(document.getElementById('quantity').value) || 1,
                justification: document.getElementById('justification').value
            };

            try {
                showLoading(true);
                const token = localStorage.getItem('authToken');

                const response = await fetch(`${API_URL}/forms/it-equipment-requests`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(requestData)
                });

                const data = await response.json();

                if (response.ok) {
                    showAlert('IT equipment request submitted successfully!', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    showAlert(data.error || 'Failed to submit IT equipment request', 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert('An error occurred while submitting the request', 'error');
            } finally {
                showLoading(false);
            }
        });

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert alert-${type}`;
            alert.style.display = 'block';

            setTimeout(() => {
                alert.style.display = 'none';
            }, 5000);
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        // Navigation function
        function goBack() {
            if (document.referrer && document.referrer.includes(window.location.hostname)) {
                window.history.back();
            } else {
                window.location.href = 'index.html';
            }
        }
    </script>
</body>
</html>
